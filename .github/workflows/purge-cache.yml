name: purge-cache

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm purging all bld caches'
        required: true
        default: 'no'

jobs:
  clear-cache:
    if: ${{ inputs.confirm == 'yes' }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
    steps:
      - name: Purge bld caches for ${{ runner.os }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS_NAME: ${{ runner.os }}
        run: |
          echo "Purging all caches with prefix $OS_NAME-bld-"
          
          # List all cache keys with that prefix and delete them
          gh cache list --key "$OS_NAME-bld-" --limit 100 --json id,key | jq -r '.[].id' | while read id; do
            echo "Deleting cache id $id"
            gh cache delete $id
          done
          
          echo "Done for $OS_NAME"